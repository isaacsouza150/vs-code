<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Dados pessoais</legend>
        <label for="nome_completo">Nome completo: </label>
        <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite seu nome completo aqui">

        <label for="dt_nascimento">Data de nascimento</label>
        <input type="date" id="dt_nascimento" name="dt_nascimento">

        <label for="email">E-mail</label>
        <input type="email" id="dt_nascimento" name="dt_nascimento">

        <label for="uf">Unidade Federativa</label>
        <select name="uf" id="uf">
            <option value="sp">SP</option>
            <option value="sc">SC</option>
            <option value="rs">RS</option>
            <option value="rj">RJ</option>
            <option value="mg">MG</option>
            <option value="df">DF</option>
            <option value="am">AM</option>
            <option value="se">SE</option>
            <option value="pr">PR</option>
            <option value="al">AL</option>
            <option value="to">TO</option>
            <option value="rn">RN</option>
            <option value="ba">BA</option>
            <option value="pi">PI</option>
            <option value="pa">PA</option>
            <option value="ap">AP</option>
            <option value="ac">AC</option>
            <option value="go">GO</option>
            <option value="ms">MS</option>
            <option value="pb">PB</option>
            <option value="ro">RO</option>
            <option value="ma">MA</option>
            <option value="pe">PE</option>
            <option value="es">ES</option>
        </select>

        <label for="senha"> Senha</label>
        <input type="password" id="senha" name="senha">
        </fieldset>

        <fieldset>
            <legend>Genero</legend>
            <label for="Masculino">Masculino</label>
            <input type="radio" id="Masculino" name="genero" value="M">

            <label for="Feminino">Feminino</label>
            <input type="radio" id="Feminino" name="genero" value="F">
        </fieldset>

        <fieldset>
            <legend>Cursos</legend>
            <label for="ti"> TI </label>
            <input type="checkbox" id="ti" name="cursos" value="TI">

            <label for="mecanica-a"> Mecânica aeronáutica</label>
            <input type="checkbox" id="mecanica-a", name="cursos" value="mecanica-a">
        </fieldset>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
