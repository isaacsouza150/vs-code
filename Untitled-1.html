<html>
    <head>
        <title> Apresentação </title>
        <style>
            h1 {
                color: blue;
            }
            h2 {
                color: aqua;
            }
            h3 {
                color: aquamarine;
            }
            h4 {
                color: cadetblue;
            }
            h5 {
                color: brown;
            }
            h6 {
                color: deeppink;
            }
            #div-info {
                border: dotted black 2px;
                height: 200px;
                width: 200px;
                background-color: crimson;
                font-size: 15pt;
                font-weight: bold;
                text-align: center;
                position: fixed;
                right: 0;
                background-color: purple;
                transform: translateY(-50%);
                display: flex;
                opacity: 0.5;
            }
            #div-info:hover {
                background-color: white;
            }
        </style>
    </head>

    <body>
        <h1> Introdução a fundamentos de UI e UX </h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>
        <h4>Heading 4</h4>
        <h5>Heading 5</h5>
        <h6>Heading 6</h6>

        <div id="div-info">
            Aqui eu falo sobre o elemento div
        </div>
    </body>

    <script>
        alert('Olá alunos');
    </script>

</html>
